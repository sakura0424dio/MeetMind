<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎙️ 智能会议助手 v4.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f1724;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #1a2332;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #2d3748;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .logo {
            font-size: 28px;
        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #63b3ed, #9f7aea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            background: #2d3748;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }
        .status-dot.off {
            background: #fc8181;
        }
        .status-dot.on {
            background: #48bb78;
            box-shadow: 0 0 8px rgba(72, 187, 120, 0.5);
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4299e1, #667eea);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(66, 153, 225, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-danger {
            background: linear-gradient(135deg, #fc8181, #f56565);
            color: white;
        }
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(245, 101, 101, 0.4);
        }
        .btn-danger:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-success {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(72, 187, 120, 0.4);
        }
        .btn-success:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-download {
            background: linear-gradient(135deg, #9f7aea, #805ad5);
            color: white;
        }
        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(159, 122, 234, 0.4);
        }
        .btn-download:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* 发言人切换按钮组 */
        .speaker-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #1a2332;
            border-radius: 12px;
            border: 1px solid #2d3748;
            align-items: center;
        }
        .speaker-selector .label {
            font-size: 14px;
            color: #718096;
            margin-right: 8px;
        }
        .speaker-btn {
            padding: 6px 16px;
            border: 2px solid transparent;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: #2d3748;
            color: #e2e8f0;
        }
        .speaker-btn:hover {
            background: #4a5568;
        }
        .speaker-btn.active {
            border-color: #63b3ed;
            background: #2d3748;
            box-shadow: 0 0 12px rgba(99, 179, 237, 0.2);
        }
        .speaker-btn .avatar {
            margin-right: 6px;
        }

        /* 对话展示大框 */
        .transcript-box {
            background: #0d1520;
            border-radius: 12px;
            border: 1px solid #1a2332;
            padding: 16px 20px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 16px;
            font-family: "SF Mono", "Fira Code", monospace;
        }
        .transcript-box::-webkit-scrollbar {
            width: 6px;
        }
        .transcript-box::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }
        .transcript-box .msg {
            padding: 4px 0;
            border-bottom: 1px solid #1a2332;
        }
        .transcript-box .msg .time {
            color: #4a5568;
            font-size: 12px;
            margin-right: 10px;
        }
        .transcript-box .msg .speaker {
            font-weight: 600;
            margin-right: 8px;
        }
        .transcript-box .msg .speaker.s1 {
            color: #4299e1;
        }
        .transcript-box .msg .speaker.s2 {
            color: #ed8936;
        }
        .transcript-box .msg .speaker.s3 {
            color: #48bb78;
        }
        .transcript-box .msg .speaker.s4 {
            color: #9f7aea;
        }
        .transcript-box .msg .speaker.s5 {
            color: #fc8181;
        }
        .transcript-box .msg .speaker.s6 {
            color: #ecc94b;
        }
        .transcript-box .empty-hint {
            color: #4a5568;
            text-align: center;
            padding: 40px 0;
            font-size: 14px;
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #1a2332;
            border-radius: 14px;
            border: 1px solid #2d3748;
            flex-wrap: wrap;
            gap: 12px;
        }
        .footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .footer-left .info-text {
            font-size: 13px;
            color: #718096;
        }
        .footer-left .info-text strong {
            color: #e2e8f0;
        }
        .footer-right {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 日志区域（可折叠） */
        .log-section {
            margin-top: 16px;
            background: #0d1520;
            border-radius: 12px;
            border: 1px solid #1a2332;
            overflow: hidden;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #1a2332;
            border-bottom: 1px solid #2d3748;
            cursor: pointer;
            user-select: none;
        }
        .log-header span {
            font-size: 13px;
            color: #718096;
            font-weight: 500;
        }
        .log-body {
            padding: 8px 16px;
            max-height: 120px;
            overflow-y: auto;
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #718096;
        }
        .log-body .log-ok {
            color: #48bb78;
        }
        .log-body .log-err {
            color: #fc8181;
        }
        .log-body .log-info {
            color: #63b3ed;
        }
        .log-body .log-warn {
            color: #ecc94b;
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .footer-right {
                justify-content: center;
            }
            .speaker-selector {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 顶部 -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🎙️</span>
                <div>
                    <h1>智能会议助手 <span style="font-size:14px;font-weight:400;color:#718096;">v4.0</span></h1>
                </div>
            </div>
            <div class="header-right">
                <div class="status-badge">
                    <span class="status-dot off" id="wsDot"></span>
                    <span id="wsStatus">未连接</span>
                </div>
                <div class="status-badge">
                    <span class="status-dot off" id="micDot"></span>
                    <span id="micStatus">麦克风关闭</span>
                </div>
                <span style="color:#4a5568;font-size:13px;" id="timerDisplay">⏱️ 00:00</span>
            </div>
        </header>

        <!-- 发言人选择 -->
        <div class="speaker-selector">
            <span class="label">🎯 当前发言人：</span>
            <button class="speaker-btn active" data-speaker="张伟" data-color="s1">🎮 张伟</button>
            <button class="speaker-btn" data-speaker="李婷" data-color="s2">📝 李婷</button>
            <button class="speaker-btn" data-speaker="王磊" data-color="s3">💻 王磊</button>
            <button class="speaker-btn" data-speaker="陈露" data-color="s4">🎨 陈露</button>
            <button class="speaker-btn" data-speaker="赵岩" data-color="s5">📊 赵岩</button>
            <button class="speaker-btn" data-speaker="刘洋" data-color="s6">📋 刘洋</button>
        </div>

        <!-- 对话展示框 -->
        <div class="transcript-box" id="transcriptBox">
            <div class="empty-hint">💬 会议开始后，这里将显示实时对话...</div>
        </div>

        <div id="reportArea" style="display:none; margin-top:20px; background:#1a2332; border-radius:12px; padding:20px; border:1px solid #2d3748;">
            <h3 style="color:#63b3ed; margin-bottom:12px;">📄 会议报告</h3>
            <div id="reportContent" style="color:#e2e8f0; font-size:14px; line-height:1.8; max-height:400px; overflow-y:auto; background:#0d1520; padding:16px; border-radius:8px;">
            </div>
        </div>
        <!-- 底部控制区 -->
        <div class="footer-controls">
            <div class="footer-left">
                <span class="info-text" id="connectionInfo">📡 等待连接...</span>
            </div>
            <div class="footer-right">
                <button class="btn btn-primary" id="btnStart">🎤 开始会议</button>
                <button class="btn btn-danger" id="btnStop" disabled>⏹ 结束会议</button>
                <button class="btn btn-success" id="btnGenerateReport" disabled>📄 生成报告</button>
                <button class="btn btn-download" id="btnDownloadAudio" disabled>⬇️ 下载录音</button>
            </div>
        </div>

        <!-- 日志 -->
        <div class="log-section">
            <div class="log-header" id="logToggle">
                <span>📋 系统日志</span>
                <span class="log-toggle">点击展开/收起</span>
            </div>
            <div class="log-body" id="logArea" style="display:block;">
                🚀 系统就绪，点击「开始会议」启动
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  配置 & 状态
        // ================================================================
        const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}/ws/audio`;
        const TOKEN_STORAGE_KEY = 'meetmind_api_token';

        // 从 sessionStorage 读取访问令牌；没有时提示用户输入
        function getApiToken() {
            let token = sessionStorage.getItem(TOKEN_STORAGE_KEY) || '';
            if (!token) {
                token = (window.prompt('请输入访问令牌（MEETMIND_API_TOKEN）:') || '').trim();
                if (token) sessionStorage.setItem(TOKEN_STORAGE_KEY, token);
            }
            return token;
        }

        // 所有数据/写接口统一携带 Bearer Token
        async function authFetch(url, options = {}) {
            const token = getApiToken();
            const headers = new Headers(options.headers || {});
            if (token) headers.set('Authorization', `Bearer ${token}`);

            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                sessionStorage.removeItem(TOKEN_STORAGE_KEY);
                throw new Error('认证失败：访问令牌无效，请刷新页面后重新输入');
            }
            return response;
        }

        // WebSocket 使用短时一次性票据，避免把长期令牌放进 URL
        async function fetchWsTicket() {
            const response = await authFetch('/api/ws_ticket');
            if (!response.ok) {
                throw new Error(`获取 WebSocket 访问票据失败 (HTTP ${response.status})`);
            }
            const data = await response.json();
            return data.ticket;
        }
        const SPEAKERS = ['张伟', '李婷', '王磊', '陈露', '赵岩', '刘洋'];
        const SPEAKER_COLORS = {
            '张伟': 's1',
            '李婷': 's2',
            '王磊': 's3',
            '陈露': 's4',
            '赵岩': 's5',
            '刘洋': 's6'
        };

        let ws = null;
        let audioStream = null;
        let isRecording = false;
        let isConnected = false;
        let chunkCount = 0;
        let byteCount = 0;
        let transcribeCount = 0;
        let messageCount = 0;
        let timerInterval = null;
        let seconds = 0;
        let currentSpeaker = '张伟'; // 默认发言人

        // 录音数据存储（用于下载）
        let recordedAudioChunks = [];
        let audioContext = null;
        let audioProcessor = null;
        let audioSource = null;

        // 会议记录
        let meetingLog = [];

        // DOM 引用
        const wsDot = document.getElementById('wsDot');
        const wsStatus = document.getElementById('wsStatus');
        const micDot = document.getElementById('micDot');
        const micStatus = document.getElementById('micStatus');
        const timerDisplay = document.getElementById('timerDisplay');
        const transcriptBox = document.getElementById('transcriptBox');
        const connectionInfo = document.getElementById('connectionInfo');
        const logArea = document.getElementById('logArea');
        const logToggle = document.getElementById('logToggle');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnGenerateReport = document.getElementById('btnGenerateReport');
        const btnDownloadAudio = document.getElementById('btnDownloadAudio');
        const speakerBtns = document.querySelectorAll('.speaker-btn');

        // ================================================================
        //  安全工具：所有来自 ASR / LLM / 服务端的文本都必须转义
        // ================================================================
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        // ================================================================
        //  日志工具
        // ================================================================
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : type === 'warn' ? 'log-warn' : 'log-info';
            const div = document.createElement('div');
            const span = document.createElement('span');
            span.className = cls;
            span.textContent = `[${time}] ${msg}`;
            div.appendChild(span);
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        // ================================================================
        //  UI 更新
        // ================================================================
        function updateUI() {
            const connected = ws && ws.readyState === WebSocket.OPEN;
            wsDot.className = `status-dot ${connected ? 'on' : 'off'}`;
            wsStatus.textContent = connected ? '已连接' : '未连接';

            const micOn = isRecording;
            micDot.className = `status-dot ${micOn ? 'on' : 'off'}`;
            micStatus.textContent = micOn ? '🎙️ 录音中' : '麦克风关闭';

            btnStart.disabled = isRecording || connected;
            btnStop.disabled = !isRecording;
            btnGenerateReport.disabled = !isRecording && messageCount === 0;
            btnDownloadAudio.disabled = recordedAudioChunks.length === 0;

            if (!connected && !isRecording) {
                connectionInfo.textContent = '📡 等待连接...';
            }
        }

        // ================================================================
        //  计时器
        // ================================================================
        function startTimer() {
            seconds = 0;
            timerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                timerDisplay.textContent = `⏱️ ${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ================================================================
        //  添加消息到展示框
        // ================================================================
        function addMessage(speaker, text) {
    meetingLog.push({ speaker, text });
    messageCount++;

    // 移除空状态提示
    const empty = transcriptBox.querySelector('.empty-hint');
    if (empty) empty.remove();

    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg';

    // 发言人只允许来自白名单，避免任意文本进入 class 属性
    const safeSpeaker = SPEAKERS.includes(speaker) ? speaker : '未知发言人';
    const colorClass = SPEAKER_COLORS[safeSpeaker] || 's1';

    // 简洁格式：发言人：内容（不加时间戳）
    const speakerSpan = document.createElement('span');
    speakerSpan.className = `speaker ${colorClass}`;
    speakerSpan.textContent = `${safeSpeaker}：`;

    const contentSpan = document.createElement('span');
    contentSpan.className = 'content';
    contentSpan.textContent = text;

    msgDiv.appendChild(speakerSpan);
    msgDiv.appendChild(contentSpan);

    transcriptBox.appendChild(msgDiv);
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
}

        // ================================================================
        //  发言人切换
        // ================================================================
        speakerBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                speakerBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSpeaker = btn.dataset.speaker;
                connectionInfo.textContent = `🎯 当前发言人: ${currentSpeaker}`;
                log(`切换发言人: ${currentSpeaker}`, 'info');
            });
        });

        // ================================================================
        //  WebSocket 连接
        // ================================================================
        async function connectWebSocket() {
            const ticket = await fetchWsTicket();
            const wsUrl = `${WS_URL}?ticket=${encodeURIComponent(ticket)}`;

            return new Promise((resolve, reject) => {
                try {
                    ws = new WebSocket(wsUrl);
                    ws.binaryType = 'arraybuffer';

                    ws.onopen = () => {
                        isConnected = true;
                        log('✅ WebSocket 连接成功', 'ok');
                        updateUI();
                        resolve();
                    };

                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.type === 'stats') {
                                transcribeCount = data.transcribes || transcribeCount;
                                updateUI();
                            } else if (data.type === 'transcription') {
                                const text = data.text;
                                const segId = data.segment_id || 0;
                                log(`🎤 转录 [${segId}]: "${text}"`, 'ok');
                                // 使用当前发言人
                                addMessage(currentSpeaker, text);
                                updateUI();
                            }
                        } catch (e) {
                            // 二进制数据忽略
                        }
                    };

                    ws.onerror = (error) => {
                        log(`❌ WebSocket 错误: ${error}`, 'err');
                        reject(error);
                    };

                    ws.onclose = () => {
                        isConnected = false;
                        log('🔌 WebSocket 连接关闭', 'info');
                        updateUI();
                    };
                } catch (e) {
                    reject(e);
                }
            });
        }

        // ================================================================
        //  开始会议
        // ================================================================
        async function startMeeting() {
            try {
                log('🎤 正在连接 WebSocket...', 'info');
                await connectWebSocket();

                log('🎙️ 正在获取麦克风权限...', 'info');
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // 使用 AudioContext 采集 PCM
                audioContext = new(window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 16000
                });
                audioSource = audioContext.createMediaStreamSource(audioStream);
                audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);

                audioProcessor.onaudioprocess = (event) => {
                    const inputData = event.inputBuffer.getChannelData(0);

                    // 保存原始音频（用于下载调试）
                    recordedAudioChunks.push(new Float32Array(inputData));

                    // 转为 Int16 并发送
                    const int16Data = new Int16Array(inputData.length);
                    for (let i = 0; i < inputData.length; i++) {
                        const s = Math.max(-1, Math.min(1, inputData[i]));
                        int16Data[i] = isNaN(s) ? 0 : (s < 0 ? s * 0x8000 : s * 0x7FFF);
                    }
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(int16Data.buffer);
                        chunkCount++;
                        byteCount += int16Data.buffer.byteLength;
                        if (chunkCount % 20 === 0) updateUI();
                    }
                };

                audioSource.connect(audioProcessor);
                audioProcessor.connect(audioContext.destination);

                isRecording = true;
                startTimer();
                log('✅ 会议已开始！', 'ok');
                updateUI();

                // 清空之前的记录
                meetingLog = [];
                transcriptBox.innerHTML = `<div class="empty-hint">💬 会议进行中，实时对话将显示在这里...</div>`;

            } catch (error) {
                log(`❌ 启动失败: ${error.message}`, 'err');
                console.error(error);
                stopMeeting();
            }
        }

        // ================================================================
        //  停止会议
        // ================================================================
        function stopMeeting() {
            log('⏹ 正在结束会议...', 'info');

            if (audioProcessor) {
                audioProcessor.disconnect();
                audioProcessor = null;
            }
            if (audioSource) {
                audioSource.disconnect();
                audioSource = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
            ws = null;
            isConnected = false;
            isRecording = false;

            stopTimer();
            updateUI();

            log(`✅ 会议已结束，共 ${messageCount} 条消息`, 'ok');

            if (messageCount > 0) {
                btnGenerateReport.disabled = false;
                log('📄 点击「生成报告」查看完整对话', 'info');
            }
            if (recordedAudioChunks.length > 0) {
                btnDownloadAudio.disabled = false;
                log(`📥 点击「下载录音」保存原始音频 (${recordedAudioChunks.length} 个片段)`, 'info');
            }
        }

        // ================================================================
        //  生成报告（展示完整对话）
        // ================================================================
        async function generateReport() {
    if (meetingLog.length === 0) {
        log('⚠️ 没有会议记录', 'warn');
        return;
    }

    log('📄 正在生成报告...', 'info');
    btnGenerateReport.disabled = true;
    btnGenerateReport.textContent = '⏳ 生成中...';

    try {
        // 生成会议标题
        const title = `会议 ${new Date().toLocaleString()}`;

        const response = await authFetch('/api/generate_report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: title,
                meeting_log: meetingLog
            })
        });

        const result = await response.json();

        if (result.success) {
            log('✅ 报告生成成功！', 'ok');

            // 显示报告区域
            const reportArea = document.getElementById('reportArea');
            const reportContent = document.getElementById('reportContent');
            reportArea.style.display = 'block';

            // 先整体转义，再做受控的 Markdown 替换：
            // LLM 输出不可信，绝不能把原始 HTML 直接交给 innerHTML
            let html = escapeHtml(result.report_markdown || '无报告内容');
            html = html
                .replace(/^### (.*)$/gm, '<h3 style="color:#63b3ed;margin:12px 0 8px 0;">$1</h3>')
                .replace(/^## (.*)$/gm, '<h2 style="color:#9f7aea;margin:16px 0 10px 0;">$1</h2>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            reportContent.innerHTML = html;

            // 显示会议类型标签
            const typeLabel = document.createElement('div');
            typeLabel.style.cssText = 'display:inline-block;background:#2d3748;padding:2px 12px;border-radius:12px;font-size:12px;color:#a0aec0;margin-bottom:10px;';
            typeLabel.textContent = `🏷️ 类型: ${result.meeting_type || '未分类'}`;
            reportContent.prepend(typeLabel);

            log('📊 报告已保存到数据库', 'info');
        } else {
            // FastAPI 的 HTTPException 返回 detail，业务错误返回 error
            log(`❌ 生成失败: ${result.error || result.detail || '未知错误'}`, 'err');
        }
    } catch (error) {
        log(`❌ 请求失败: ${error.message}`, 'err');
    } finally {
        btnGenerateReport.disabled = false;
        btnGenerateReport.textContent = '📄 生成报告';
    }
}

        // ================================================================
        //  下载录音（WAV）
        // ================================================================
        function downloadRecording() {
            if (recordedAudioChunks.length === 0) {
                log('⚠️ 没有录音数据', 'warn');
                return;
            }

            log('📥 正在生成录音文件...', 'info');

            let totalLength = 0;
            for (let chunk of recordedAudioChunks) totalLength += chunk.length;
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (let chunk of recordedAudioChunks) {
                merged.set(chunk, offset);
                offset += chunk.length;
            }

            let maxVal = 0;
            for (let i = 0; i < merged.length; i++) {
                const abs = Math.abs(merged[i]);
                if (abs > maxVal) maxVal = abs;
            }
            if (maxVal < 0.01) log('⚠️ 录音信号极弱', 'warn');
            else log(`🔊 录音峰值振幅: ${maxVal.toFixed(4)}`, 'info');

            const numSamples = merged.length;
            const pcmData = new Int16Array(numSamples);
            const gain = maxVal > 0.001 ? 0.9 / maxVal : 0.9;
            for (let i = 0; i < numSamples; i++) {
                const s = Math.max(-1, Math.min(1, merged[i] * gain));
                pcmData[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }

            const sampleRate = 16000;
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = numSamples * 2;

            const wavBuffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(wavBuffer);

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            const pcmInt16 = new Int16Array(wavBuffer, 44, numSamples);
            pcmInt16.set(pcmData);

            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `meeting_recording_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.wav`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            log('✅ 录音已下载', 'ok');
        }

        // ================================================================
        //  事件绑定
        // ================================================================
        btnStart.addEventListener('click', startMeeting);
        btnStop.addEventListener('click', stopMeeting);
        btnGenerateReport.addEventListener('click', generateReport);
        btnDownloadAudio.addEventListener('click', downloadRecording);

        logToggle.addEventListener('click', () => {
            const visible = logArea.style.display !== 'none';
            logArea.style.display = visible ? 'none' : 'block';
            logToggle.textContent = visible ? '点击展开' : '点击收起';
        });

        window.addEventListener('beforeunload', () => {
            if (isRecording) stopMeeting();
        });

        // ================================================================
        //  初始化
        // ================================================================
        updateUI();
        log('🚀 系统就绪，点击「开始会议」启动', 'info');
        log('💡 点击下方发言人按钮切换当前发言人（默认：张伟）', 'info');
        log('📥 会议结束后可下载录音用于调试', 'info');
    </script>
</body>
</html>
